<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgSphere" x1="150" y1="80" x2="650" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dbe8fb" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#edf4fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="screenGrad" x1="200" y1="120" x2="600" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8faff"/>
    </linearGradient>

    <linearGradient id="govBlueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1351b4"/>
      <stop offset="100%" stop-color="#0c326f"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe169"/>
      <stop offset="100%" stop-color="#ffcd07"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#28a745"/>
      <stop offset="100%" stop-color="#168821"/>
    </linearGradient>

    <linearGradient id="cardShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c326f" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0c326f" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Filters for Depth and Drop Shadows -->
    <filter id="shadowLg" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0c326f" flood-opacity="0.12"/>
    </filter>

    <filter id="shadowMd" x="-20%" y="-20%" width="140%" height="145%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0c326f" flood-opacity="0.1"/>
    </filter>

    <filter id="shadowSm" x="-20%" y="-20%" width="140%" height="145%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0c326f" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- ================= BACKGROUND LAYER ================= -->
  <!-- Ambient Soft Blobs -->
  <circle cx="410" cy="310" r="260" fill="url(#bgSphere)"/>
  <ellipse cx="260" cy="460" rx="140" ry="80" fill="#e1edfd" opacity="0.6"/>
  <ellipse cx="580" cy="200" rx="90" ry="90" fill="#e8f1fd" opacity="0.5"/>

  <!-- Subtle Geometric Grid Patterns -->
  <g opacity="0.35" fill="#a4c4f4">
    <circle cx="160" cy="180" r="3"/>
    <circle cx="180" cy="180" r="3"/>
    <circle cx="200" cy="180" r="3"/>
    <circle cx="160" cy="200" r="3"/>
    <circle cx="180" cy="200" r="3"/>
    <circle cx="200" cy="200" r="3"/>
    <circle cx="160" cy="220" r="3"/>
    <circle cx="180" cy="220" r="3"/>
    <circle cx="200" cy="220" r="3"/>

    <circle cx="620" cy="430" r="3"/>
    <circle cx="640" cy="430" r="3"/>
    <circle cx="660" cy="430" r="3"/>
    <circle cx="620" cy="450" r="3"/>
    <circle cx="640" cy="450" r="3"/>
    <circle cx="660" cy="450" r="3"/>
    <circle cx="620" cy="470" r="3"/>
    <circle cx="640" cy="470" r="3"/>
    <circle cx="660" cy="470" r="3"/>
  </g>

  <!-- Decorative Accent Icons in Background -->
  <!-- Plus icons -->
  <path d="M630 130 v18 M621 139 h18" stroke="#ffcd07" stroke-width="3" stroke-linecap="round"/>
  <path d="M170 370 v14 M163 377 h14" stroke="#1351b4" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Sparkles -->
  <polygon points="530,95 533,103 541,106 533,109 530,117 527,109 519,106 527,103" fill="#ffcd07"/>
  <polygon points="230,120 232,126 238,128 232,130 230,136 228,130 222,128 228,126" fill="#1351b4" opacity="0.5"/>

  <!-- ================= BASE SURFACE / TABLE ================= -->
  <ellipse cx="400" cy="550" rx="340" ry="24" fill="#0c326f" opacity="0.06"/>
  <rect x="140" y="520" width="520" height="14" rx="7" fill="#ffffff" filter="url(#shadowSm)"/>
  <rect x="160" y="528" width="480" height="6" rx="3" fill="#e0e8f6"/>

  <!-- ================= CENTRAL SCREEN (LEARNING PORTAL) ================= -->
  <!-- Screen Stand -->
  <path d="M380 470 L370 522 L430 522 L420 470 Z" fill="#cfdcee"/>
  <ellipse cx="400" cy="522" rx="45" ry="6" fill="#b9cbdf"/>

  <!-- Screen Frame -->
  <rect x="230" y="140" width="340" height="330" rx="20" fill="#ffffff" filter="url(#shadowLg)"/>
  <rect x="232" y="142" width="336" height="326" rx="18" fill="#f8faff" stroke="#e1ebf7" stroke-width="2"/>

  <!-- Screen Header (Gov.br Style Bar) -->
  <path d="M232 160 C232 150 240 142 250 142 L550 142 C560 142 568 150 568 160 L568 186 L232 186 Z" fill="#1351b4"/>
  <!-- Gov.br Flag Bar Elements -->
  <rect x="252" y="158" width="20" height="12" rx="2" fill="#168821"/>
  <polygon points="262,159 270,164 262,169 254,164" fill="#ffcd07"/>
  <circle cx="262" cy="164" r="3" fill="#1351b4"/>
  <!-- Mini Navigation Circles -->
  <circle cx="536" cy="164" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="522" cy="164" r="4" fill="#ffffff" opacity="0.5"/>
  <circle cx="508" cy="164" r="4" fill="#ffffff" opacity="0.5"/>

  <!-- Screen Inner Content: Platform Interface -->
  <!-- Welcome Banner Card inside screen -->
  <rect x="256" y="206" width="288" height="68" rx="12" fill="#eef4fd"/>
  <rect x="272" y="222" width="130" height="10" rx="5" fill="#1351b4"/>
  <rect x="272" y="240" width="90" height="7" rx="3.5" fill="#7194c7"/>
  <circle cx="496" cy="240" r="20" fill="#dbe8fb"/>
  <path d="M496 230 C499 230 502 233 502 236 C502 239 499 242 496 242 C493 242 490 239 490 236 C490 233 493 230 496 230 Z" fill="#1351b4"/>
  <path d="M486 250 C486 245 491 244 496 244 C501 244 506 245 506 250 Z" fill="#1351b4"/>

  <!-- Module Cards Inside Interface -->
  <rect x="256" y="288" width="136" height="84" rx="10" fill="#ffffff" stroke="#e5edfa" stroke-width="1.5"/>
  <rect x="270" y="302" width="28" height="28" rx="6" fill="#fef0c8"/>
  <path d="M284 310 L289 319 L279 319 Z" fill="#c2850c"/>
  <rect x="270" y="340" width="80" height="7" rx="3.5" fill="#22426e"/>
  <rect x="270" y="353" width="50" height="5" rx="2.5" fill="#a4bad9"/>

  <rect x="408" y="288" width="136" height="84" rx="10" fill="#ffffff" stroke="#e5edfa" stroke-width="1.5"/>
  <rect x="422" y="302" width="28" height="28" rx="6" fill="#d4eed8"/>
  <circle cx="436" cy="316" r="6" fill="#168821"/>
  <path d="M433 316 L435 318 L439 314" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="422" y="340" width="75" height="7" rx="3.5" fill="#22426e"/>
  <rect x="422" y="353" width="55" height="5" rx="2.5" fill="#a4bad9"/>

  <!-- Progress Bar at Screen Bottom -->
  <rect x="256" y="388" width="288" height="42" rx="10" fill="#f0f5fc"/>
  <rect x="272" y="405" width="160" height="8" rx="4" fill="#e0eaf6"/>
  <rect x="272" y="405" width="105" height="8" rx="4" fill="url(#govBlueGrad)"/>
  <circle cx="488" cy="409" r="12" fill="#ffcd07"/>
  <path d="M485 409 L487 411 L492 406" stroke="#0c326f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ================= FLOATING BADGE LEFT (DIGITAL IDENTITY) ================= -->
  <g filter="url(#shadowMd)">
    <rect x="110" y="250" width="144" height="110" rx="16" fill="#ffffff" stroke="#e2edfc" stroke-width="1.5"/>
    <circle cx="152" cy="292" r="22" fill="url(#govBlueGrad)"/>
    <!-- Security Shield / Key -->
    <path d="M152 279 L162 284 C162 293 157 299 152 303 C147 299 142 293 142 284 Z" fill="#ffcd07"/>
    <circle cx="152" cy="289" r="3" fill="#0c326f"/>
    <path d="M152 292 L152 297" stroke="#0c326f" stroke-width="2" stroke-linecap="round"/>
    <!-- Card Text -->
    <rect x="126" y="324" width="80" height="8" rx="4" fill="#0c326f"/>
    <rect x="126" y="338" width="52" height="6" rx="3" fill="#7194c7"/>
    <!-- Checkmark Pill -->
    <rect x="184" y="272" width="54" height="18" rx="9" fill="#d4eed8"/>
    <text x="193" y="284" font-family="'Rawline', 'Open Sans', sans-serif" font-size="9" font-weight="700" fill="#168821">GOV.BR</text>
  </g>

  <!-- ================= FLOATING BADGE RIGHT (LEARNING CERTIFICATE) ================= -->
  <g filter="url(#shadowMd)">
    <rect x="546" y="230" width="148" height="106" rx="16" fill="#ffffff" stroke="#e2edfc" stroke-width="1.5"/>
    <!-- Education Icon (Graduation Cap) -->
    <circle cx="620" cy="268" r="20" fill="url(#goldGrad)"/>
    <path d="M620 258 L632 264 L620 270 L608 264 Z" fill="#0c326f"/>
    <path d="M612 268 L612 274 C612 277 615 280 620 280 C625 280 628 277 628 274 L628 268" fill="#0c326f"/>
    <path d="M632 265 L635 272" stroke="#0c326f" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Card Lines -->
    <rect x="568" y="298" width="104" height="8" rx="4" fill="#0c326f"/>
    <rect x="568" y="312" width="70" height="6" rx="3" fill="#a4bad9"/>
    <!-- Star Rating Accent -->
    <circle cx="568" cy="254" r="3" fill="#ffcd07"/>
    <circle cx="578" cy="254" r="3" fill="#ffcd07"/>
    <circle cx="588" cy="254" r="3" fill="#ffcd07"/>
  </g>

  <!-- ================= DESK ACCESSORIES ================= -->
  <!-- Plant on Desk (Right) -->
  <g>
    <path d="M614 490 L606 522 L634 522 L626 490 Z" fill="#e8ba9b"/>
    <ellipse cx="620" cy="490" rx="10" ry="3" fill="#d99f7d"/>
    <!-- Leaves -->
    <path d="M620 488 C615 470 596 468 598 454 C612 458 620 472 620 488 Z" fill="#168821"/>
    <path d="M620 488 C625 466 644 464 642 450 C628 454 620 470 620 488 Z" fill="#229d30"/>
    <path d="M620 488 C618 460 626 450 620 440 C614 452 616 470 620 488 Z" fill="#1b7e25"/>
  </g>

  <!-- Coffee Mug (Left) -->
  <g>
    <rect x="190" y="500" width="22" height="22" rx="4" fill="#1351b4"/>
    <path d="M212 504 C218 504 218 514 212 514" stroke="#1351b4" stroke-width="3" fill="none"/>
    <!-- Steam -->
    <path d="M196 495 C194 491 198 488 196 484" stroke="#a4bad9" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M204 495 C202 490 206 487 204 482" stroke="#a4bad9" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

</svg>
